databases:
  - name: pdd-db
    plan: free

services:
  - type: web
    name: pddarzan
    runtime: node
    plan: free
    buildCommand: npm install && npm rebuild sqlite3 --build-from-source
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pdd-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20

