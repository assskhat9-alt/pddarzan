<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, -apple-system, sans-serif; background: #F1F1F7; color: #14141B; -webkit-font-smoothing: antialiased; }
    a { color: #7A6CF0; text-decoration: none; }
    a:hover { color: #5E4FD8; }
    .lbl { font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: #9A9AAE; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F1F1F7; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <!-- atmosphere -->
  <div style="position: absolute; top: -120px; left: -80px; width: 380px; height: 380px; border-radius: 999px; background: radial-gradient(circle at 35% 35%, #C9C0FB, rgba(201,192,251,0) 68%); filter: blur(6px)"></div>
  <div style="position: absolute; top: 60px; right: -130px; width: 320px; height: 320px; border-radius: 999px; background: radial-gradient(circle at 50% 50%, #DCD6FB, rgba(220,214,251,0) 70%); filter: blur(4px)"></div>

  <!-- hero -->
  <div style="position: relative; height: 372px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
    <svg width="240" height="240" viewBox="0 0 240 240" fill="none">
      <circle cx="120" cy="120" r="104" stroke="#DCD6FB" stroke-width="1.5" stroke-dasharray="3 6"></circle>
      <circle cx="120" cy="120" r="104" stroke="#7A6CF0" stroke-width="4" stroke-linecap="round" stroke-dasharray="653.45" stroke-dashoffset="379" transform="rotate(-90 120 120)"></circle>
      <circle cx="120" cy="120" r="78" stroke="#E4E0FC" stroke-width="4"></circle>
      <circle cx="120" cy="120" r="78" stroke="#9A8DF5" stroke-width="4" stroke-linecap="round" stroke-dasharray="490.09" stroke-dashoffset="186" transform="rotate(-90 120 120)"></circle>
      <circle cx="120" cy="120" r="54" stroke="#EDEAFE" stroke-width="4"></circle>
      <circle cx="120" cy="120" r="54" stroke="#BDB4FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="129" transform="rotate(-90 120 120)"></circle>
      <path d="M120 92l24.2 27.1L120 146.2 95.8 119.1z" fill="#FFFFFF" stroke="#7A6CF0" stroke-width="3" stroke-linejoin="round"></path>
      <circle cx="120" cy="119" r="6" fill="#7A6CF0"></circle>
    </svg>
  </div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; padding: 0 26px 30px">

    <div style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: .22em; text-align: center">FORMA</div>
    <div style="font-size: 10px; font-weight: 800; letter-spacing: .3em; text-align: center; color: #9A9AAE; margin-top: 9px">ЖЫЛ · АЙ · АПТА · КҮН</div>

    <div style="font-size: 21px; font-weight: 800; letter-spacing: -.025em; line-height: 1.32; text-align: center; margin-top: 22px; text-wrap: pretty">Үлкен мақсат бүгінгі<br>бір ғана әрекеттен басталады</div>

    <!-- cascade strip -->
    <div style="display: flex; align-items: center; gap: 0; margin-top: 24px">
      <sc-for list="{{chain}}" as="c" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; flex-grow: 1">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px; flex-shrink: 0">
            <div style="width: 38px; height: 38px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: {{c.bg}}; border: 1.5px solid {{c.bd}}">
              <span style="font-size: 11px; font-weight: 800; color: {{c.fg}}">{{c.pct}}</span>
            </div>
            <span style="font-size: 9.5px; font-weight: 800; letter-spacing: .05em; color: #8A8A9E">{{c.n}}</span>
          </div>
          <sc-if value="{{c.line}}" hint-placeholder-val="{{ true }}">
            <div style="flex-grow: 1; height: 1.5px; background: #DCD6FB; margin-bottom: 17px"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1"></div>

    <!-- actions -->
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: center; gap: 9px; padding: 16px; border-radius: 18px; background: #14141B; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M17.05 12.54c-.02-2.2 1.79-3.25 1.87-3.3-1.02-1.49-2.6-1.7-3.17-1.72-1.35-.14-2.63.79-3.31.79-.68 0-1.74-.77-2.86-.75-1.47.02-2.83.85-3.58 2.16-1.53 2.65-.39 6.57 1.1 8.72.73 1.05 1.6 2.23 2.74 2.19 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.32-3.48zM14.9 5.6c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.3-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.21z"></path></svg>
        <span style="font-size: 14px; font-weight: 800; color: #FFFFFF">Apple ID арқылы кіру</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 9px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #E6E6EF; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14141B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
        <span style="font-size: 14px; font-weight: 800; color: #14141B">Email арқылы кіру</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 6px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A6A6B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5H7a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-15a2 2 0 0 0-2-2z"/><path d="M11 18.5h2"/></svg>
        <span style="font-size: 11px; font-weight: 700; color: #A6A6B8">Бір аккаунт — iPhone, iPad, Mac</span>
      </div>
    </div>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { n: 'ЖЫЛ', pct: 42 },
      { n: 'АЙ', pct: 55 },
      { n: 'АПТА', pct: 62 },
      { n: 'КҮН', pct: 40 },
    ];
    const chain = raw.map((c, i) => ({
      n: c.n,
      pct: c.pct,
      bg: i === 3 ? '#7A6CF0' : '#FFFFFF',
      bd: i === 3 ? '#7A6CF0' : '#E0DBFB',
      fg: i === 3 ? '#FFFFFF' : '#6A59EC',
      line: i < raw.length - 1,
    }));
    return { chain };
  }
}
</script>
</body>
</html>
