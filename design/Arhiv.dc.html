<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, -apple-system, sans-serif; background: #F1F1F7; color: #14141B; -webkit-font-smoothing: antialiased; }
    a { color: #7A6CF0; text-decoration: none; }
    a:hover { color: #5E4FD8; }
    .lbl { font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: #9A9AAE; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F1F1F7; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14141B" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <div style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .16em">АРХИВ</div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14141B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 0; overflow: hidden">

    <!-- stat tiles -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 12px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 8px 22px rgba(20,20,45,.045)">
          <div style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -.04em; line-height: 1">{{s.v}}</div>
          <div style="font-size: 9.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #9A9AAE; margin-top: 6px; line-height: 1.3">{{s.n}}</div>
        </div>
      </sc-for>
    </div>

    <!-- monthly chart -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 16px 18px 14px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 10px 28px rgba(20,20,45,.05)">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px">
        <div class="lbl">Ай сайынғы орындалу</div>
        <span style="font-size: 11px; font-weight: 800; color: #7A6CF0">орт. 68%</span>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 7px; height: 78px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end">
            <span style="font-size: 9px; font-weight: 800; color: {{b.tc}}">{{b.v}}</span>
            <div style="width: 100%; border-radius: 7px; background: {{b.c}}; height: {{b.h}}"></div>
            <span style="font-size: 8.5px; font-weight: 800; color: #B4B4C6">{{b.n}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- filters -->
    <div style="display: flex; gap: 7px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <div onClick="{{f.pick}}" style="padding: 8px 13px; border-radius: 999px; cursor: pointer; font-size: 11.5px; font-weight: 800; background: {{f.bg}}; color: {{f.fg}}; border: 1.5px solid {{f.bd}}">{{f.n}}</div>
      </sc-for>
    </div>

    <!-- entries -->
    <div style="display: flex; flex-direction: column; gap: 9px; overflow: hidden">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 15px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 8px 22px rgba(20,20,45,.045)">
          <div style="display: flex; align-items: center; gap: 9px">
            <div style="width: 20px; height: 20px; border-radius: 7px; flex-shrink: 0; background: #7A6CF0; display: flex; align-items: center; justify-content: center">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
            </div>
            <div style="flex-grow: 1; min-width: 0">
              <div style="font-size: 12.5px; font-weight: 700; letter-spacing: -.01em">{{e.title}}</div>
            </div>
            <span style="font-size: 10px; font-weight: 700; color: #A6A6B8; flex-shrink: 0">{{e.date}}</span>
          </div>

          <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px">
            <span style="font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #6A59EC; background: #EFEDFE; border-radius: 999px; padding: 3px 8px">{{e.level}}</span>
            <span style="font-size: 9.5px; font-weight: 800; color: #8A8A9E">{{e.mood}}</span>
          </div>

          <div style="display: flex; gap: 9px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #F4F4F9">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C6BEFB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4.2-1L3 20l1.2-4.6A8.4 8.4 0 0 1 21 11.5z"/></svg>
            <div style="font-size: 11.5px; font-weight: 500; line-height: 1.5; color: #5A5A70; text-wrap: pretty">{{e.note}}</div>
          </div>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="height: 78px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECECF3; display: flex; align-items: center; justify-content: space-around; padding: 0 18px 12px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 10px"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A6CF0" stroke-width="2" stroke-linecap="round" style="margin-top: 10px"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>
    <div style="width: 54px; height: 54px; border-radius: 999px; background: #7A6CF0; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 8px 20px rgba(122,108,240,.32)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M12 2.6l8.4 9.4L12 21.4 3.6 12z"/></svg>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 2.5v5M16 2.5v5M3.5 10.5h17"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" style="margin-top: 10px"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.5-4 4.2-5.5 7.5-5.5s6 1.5 7.5 5.5"/></svg>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 0 };
  }

  renderVals() {
    const all = [
      { title: 'Шілде айының ағылшын жоспары', level: 'Ай', lv: 2, date: '31 шіл', mood: 'Керемет',
        note: 'Айдың соңында B2 тестінен 78 ұпай. Тыңдалым тұрақты өсті — күн сайынғы 45 минут жұмыс істейді.' },
      { title: '30-апта: 4 жаттығу', level: 'Апта', lv: 3, date: '27 шіл', mood: 'Қиын',
        note: 'Үш-ақ жаттығу шықты. Кешкі уақыт жарамайды — келесі аптадан таңертеңге көшіремін.' },
      { title: '«Атомдық әдеттер» кітабы', level: 'Күн', lv: 4, date: '19 шіл', mood: 'Жақсы',
        note: 'Ең пайдалысы — 1% ереже. Мақсатты емес, жүйені құру керек деген ой қатты әсер етті.' },
      { title: 'Маусым: салмақ 2 кг', level: 'Ай', lv: 2, date: '30 мау', mood: 'Орташа',
        note: 'Мақсат 3 кг еді, 2 кг болды. Тамақтану бақылауы әлсіз — тамызда соған фокус.' },
    ];

    const fNames = ['Бәрі', 'Жыл', 'Ай', 'Апта', 'Күн'];
    const f = this.state.filter;

    const filters = fNames.map((n, i) => {
      const on = f === i;
      return {
        n,
        bg: on ? '#14141B' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#6E6E86',
        bd: on ? '#14141B' : '#ECECF3',
        pick: () => this.setState({ filter: i }),
      };
    });

    const entries = f === 0 ? all : all.filter((e) => e.lv === f);

    const bars = [
      { n: 'Қаң', v: 72 }, { n: 'Ақп', v: 65 }, { n: 'Нау', v: 80 }, { n: 'Сәу', v: 58 },
      { n: 'Мам', v: 74 }, { n: 'Мау', v: 61 }, { n: 'Шіл', v: 88 }, { n: 'Там', v: 55 },
    ].map((b, i) => ({
      n: b.n,
      v: b.v,
      h: b.v + '%',
      c: i === 7 ? '#7A6CF0' : '#DCD6FB',
      tc: i === 7 ? '#7A6CF0' : '#B4B4C6',
    }));

    const stats = [
      { v: '184', n: 'Аяқталған\nтапсырма' },
      { v: '96', n: 'Жазылған\nрефлексия' },
      { v: '68%', n: 'Орташа\nорындалу' },
    ];

    return { stats, bars, filters, entries };
  }
}
</script>
</body>
</html>
