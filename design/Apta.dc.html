<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, -apple-system, sans-serif; background: #F1F1F7; color: #14141B; -webkit-font-smoothing: antialiased; }
    a { color: #7A6CF0; text-decoration: none; }
    a:hover { color: #5E4FD8; }
    .lbl { font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: #9A9AAE; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F1F1F7; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14141B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <div style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .16em">34-АПТА</div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14141B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 0; overflow: hidden">

    <!-- week header -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 17px 18px 15px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 10px 28px rgba(20,20,45,.05)">
      <div style="display: flex; align-items: flex-start; justify-content: space-between">
        <div>
          <div class="lbl">24 – 30 тамыз</div>
          <div style="display: flex; align-items: baseline; gap: 7px; margin-top: 6px">
            <span style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -.04em; line-height: 1">{{week.pct}}%</span>
            <span style="font-size: 11px; font-weight: 700; color: #8A8A9E">{{week.doneCount}}/{{week.total}} тапсырма</span>
          </div>
        </div>
        <div style="background: #EFEDFE; border-radius: 14px; padding: 8px 12px; text-align: center">
          <div style="font-size: 9px; font-weight: 800; letter-spacing: .1em; color: #6A59EC">ҚАЛДЫ</div>
          <div style="font-size: 15px; font-weight: 800; color: #14141B; margin-top: 2px">3 күн</div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 16px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span style="font-size: 9px; font-weight: 800; letter-spacing: .04em; color: {{d.lc}}">{{d.n}}</span>
            <div style="position: relative; width: 34px; height: 34px">
              <svg width="34" height="34" viewBox="0 0 34 34">
                <circle cx="17" cy="17" r="14" fill="none" stroke="#F0F0F6" stroke-width="4"></circle>
                <circle cx="17" cy="17" r="14" fill="none" stroke="{{d.c}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="87.96" stroke-dashoffset="{{d.offset}}" transform="rotate(-90 17 17)"></circle>
              </svg>
              <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: {{d.tc}}">{{d.date}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <div class="lbl">Апталық тапсырмалар</div>
      <span style="font-size: 11px; font-weight: 800; color: #7A6CF0">Күндерге тарату</span>
    </div>

    <!-- weekly tasks -->
    <div style="display: flex; flex-direction: column; gap: 9px; overflow: hidden">
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 15px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 8px 22px rgba(20,20,45,.045)">

          <div onClick="{{t.toggle}}" style="display: flex; align-items: center; gap: 11px; cursor: pointer">
            <div style="flex-grow: 1; min-width: 0">
              <div style="font-size: 13px; font-weight: 700; letter-spacing: -.01em">{{t.title}}</div>
              <div style="display: flex; align-items: center; gap: 6px; margin-top: 5px">
                <span style="font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #6A59EC; background: #EFEDFE; border-radius: 999px; padding: 2px 7px">{{t.parent}}</span>
                <span style="font-size: 10.5px; font-weight: 700; color: #A6A6B8">{{t.count}}</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 9px; flex-shrink: 0">
              <span style="font-size: 14px; font-weight: 800; color: {{t.pctColor}}">{{t.pct}}%</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C4C4D4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: {{t.rot}}"><path d="M9 5l7 7-7 7"/></svg>
            </div>
          </div>

          <div style="height: 5px; border-radius: 999px; background: #F0F0F6; margin-top: 10px; overflow: hidden">
            <div style="height: 5px; border-radius: 999px; background: {{t.bar}}; width: {{t.w}}"></div>
          </div>

          <sc-if value="{{t.open}}" hint-placeholder-val="{{ true }}">
            <div style="margin-top: 13px; padding-top: 12px; border-top: 1px solid #F4F4F9">
              <div class="lbl" style="margin-bottom: 9px">Күндерге таратылған</div>
              <div style="display: flex; gap: 6px">
                <sc-for list="{{t.slots}}" as="s" hint-placeholder-count="7">
                  <div onClick="{{s.toggle}}" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; border-radius: 12px; cursor: pointer; background: {{s.bg}}; border: 1.5px solid {{s.bd}}">
                    <span style="font-size: 9px; font-weight: 800; color: {{s.fg}}">{{s.n}}</span>
                    <div style="width: 15px; height: 15px; border-radius: 5px; display: flex; align-items: center; justify-content: center; background: {{s.boxBg}}; border: 1.5px solid {{s.boxBd}}">
                      <sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}">
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
                      </sc-if>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-if>

        </div>
      </sc-for>
    </div>

  </div>

  <div style="height: 78px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECECF3; display: flex; align-items: center; justify-content: space-around; padding: 0 18px 12px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 10px"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" style="margin-top: 10px"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>
    <div style="width: 54px; height: 54px; border-radius: 999px; background: #7A6CF0; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 8px 20px rgba(122,108,240,.32)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M12 2.6l8.4 9.4L12 21.4 3.6 12z"/></svg>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A6CF0" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 2.5v5M16 2.5v5M3.5 10.5h17"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" style="margin-top: 10px"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.5-4 4.2-5.5 7.5-5.5s6 1.5 7.5 5.5"/></svg>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: 0,
      slots: [
        [true, false, true, false, true, false, false],
        [true, true, true, true, false, false, false],
        [false, false, true, false, false, true, false],
        [true, false, false, true, false, false, false],
      ],
    };
  }

  renderVals() {
    const DN = ['Дс', 'Сс', 'Ср', 'Бс', 'Жм', 'Сн', 'Жк'];
    const DATE = [24, 25, 26, 27, 28, 29, 30];
    const TODAY = 1;

    const meta = [
      { title: '5 рет ағылшын тыңдалым', parent: 'Ағылшын C1', planned: [0, 2, 4, 5, 6] },
      { title: '4 жаттығу — жүгіру / зал', parent: 'Дене · 78 кг', planned: [0, 1, 2, 3] },
      { title: 'Жобаның авторизация модулі', parent: 'Жеке жоба', planned: [2, 5] },
      { title: '140 бет оқу', parent: '12 кітап', planned: [0, 3] },
    ];

    const tasks = meta.map((m, i) => {
      const st = this.state.slots[i];
      const planned = m.planned;
      const doneN = planned.filter((d) => st[d]).length;
      const pct = Math.round((doneN / planned.length) * 100);

      const slots = DN.map((n, d) => {
        const isPlanned = planned.indexOf(d) !== -1;
        const done = isPlanned && st[d];
        return {
          n,
          done,
          bg: isPlanned ? (done ? '#F4F2FE' : '#FBFBFD') : '#FFFFFF',
          bd: isPlanned ? (done ? '#D8D1FB' : '#EDEDF4') : '#F6F6FA',
          fg: isPlanned ? '#43435A' : '#CFCFDC',
          boxBg: done ? '#7A6CF0' : '#FFFFFF',
          boxBd: isPlanned ? (done ? '#7A6CF0' : '#DEDEE9') : '#F0F0F6',
          toggle: () => {
            if (!isPlanned) return;
            const next = this.state.slots.map((r) => r.slice());
            next[i][d] = !next[i][d];
            this.setState({ slots: next });
          },
        };
      });

      return {
        title: m.title,
        parent: m.parent,
        pct,
        w: pct + '%',
        count: doneN + '/' + planned.length + ' күн',
        bar: pct === 100 ? '#7A6CF0' : '#A79BF8',
        pctColor: pct === 100 ? '#7A6CF0' : '#14141B',
        open: this.state.open === i,
        rot: this.state.open === i ? 'rotate(90deg)' : 'rotate(0deg)',
        slots,
        toggle: () => this.setState({ open: this.state.open === i ? -1 : i }),
      };
    });

    let total = 0;
    let doneCount = 0;
    meta.forEach((m, i) => {
      total += m.planned.length;
      doneCount += m.planned.filter((d) => this.state.slots[i][d]).length;
    });
    const weekPct = Math.round((doneCount / total) * 100);

    const C = 87.96;
    const days = DN.map((n, d) => {
      let dTotal = 0;
      let dDone = 0;
      meta.forEach((m, i) => {
        if (m.planned.indexOf(d) !== -1) {
          dTotal += 1;
          if (this.state.slots[i][d]) dDone += 1;
        }
      });
      const p = dTotal ? dDone / dTotal : 0;
      return {
        n,
        date: DATE[d],
        offset: C * (1 - p),
        c: d === TODAY ? '#7A6CF0' : (p === 1 ? '#A79BF8' : '#C6BEFB'),
        tc: d === TODAY ? '#14141B' : '#6E6E86',
        lc: d === TODAY ? '#7A6CF0' : '#B4B4C6',
      };
    });

    return { tasks, days, week: { pct: weekPct, doneCount, total } };
  }
}
</script>
</body>
</html>
