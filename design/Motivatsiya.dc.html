<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, -apple-system, sans-serif; background: #F1F1F7; color: #14141B; -webkit-font-smoothing: antialiased; }
    a { color: #7A6CF0; text-decoration: none; }
    a:hover { color: #5E4FD8; }
    .lbl { font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: #9A9AAE; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F1F1F7; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; flex-shrink: 0">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14141B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <div style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .16em">МОТИВАЦИЯ</div>
    <div style="width: 20px"></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 6px 20px 0; overflow: hidden">

    <!-- live preview -->
    <div>
      <div class="lbl" style="margin-bottom: 8px; padding-left: 4px">Басты бетте осылай көрінеді</div>
      <div style="background: #14141B; border-radius: 22px; padding: 20px; position: relative; overflow: hidden">
        <div style="position: absolute; top: -40px; right: -30px; width: 170px; height: 170px; border-radius: 999px; background: radial-gradient(circle, rgba(138,124,246,.34), rgba(138,124,246,0) 70%)"></div>
        <div style="position: relative">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#8B7DF3" opacity=".5"><path d="M9.5 5.5c-3 1.4-5 4.3-5 7.6V19h6.4v-6.4H7.3c0-2 1-3.6 2.9-4.6zm9.5 0c-3 1.4-5 4.3-5 7.6V19h6.4v-6.4h-3.6c0-2 1-3.6 2.9-4.6z"/></svg>
          <div style="font-size: 17px; font-weight: 700; line-height: 1.42; color: #FFFFFF; margin-top: 10px; text-wrap: pretty">{{active}}</div>
          <div style="display: flex; align-items: center; gap: 7px; margin-top: 14px">
            <div style="width: 5px; height: 5px; border-radius: 999px; background: #8B7DF3"></div>
            <span style="font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #6E6E86">ӘР АШҚАН САЙЫН КӨРІНЕДІ</span>
          </div>
        </div>
      </div>
    </div>

    <!-- rotate switch -->
    <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 8px 22px rgba(20,20,45,.045)">
      <div style="flex-grow: 1">
        <div style="font-size: 13px; font-weight: 700">Күн сайын кезекпен ауыссын</div>
        <div style="font-size: 10.5px; font-weight: 500; color: #8A8A9E; margin-top: 2px">Әр таңда келесі сөз шығады</div>
      </div>
      <div onClick="{{rotToggle}}" style="width: 46px; height: 27px; border-radius: 999px; flex-shrink: 0; cursor: pointer; padding: 3px; display: flex; transition: background .22s ease; background: {{rot.bg}}; justify-content: {{rot.just}}">
        <div style="width: 21px; height: 21px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(20,20,45,.22)"></div>
      </div>
    </div>

    <div class="lbl" style="padding-left: 4px; margin-top: 2px">Менің сөздерім</div>

    <div style="display: flex; flex-direction: column; gap: 8px; overflow: hidden">
      <sc-for list="{{quotes}}" as="q" hint-placeholder-count="5">
        <div onClick="{{q.pick}}" style="background: #FFFFFF; border-radius: 18px; padding: 14px 15px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; border: 1.5px solid {{q.bd}}; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 8px 22px rgba(20,20,45,.04)">
          <div style="width: 20px; height: 20px; border-radius: 999px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; border: 2px solid {{q.rbd}}; background: {{q.rbg}}">
            <sc-if value="{{q.on}}" hint-placeholder-val="{{ true }}">
              <div style="width: 7px; height: 7px; border-radius: 999px; background: #FFFFFF"></div>
            </sc-if>
          </div>
          <div style="flex-grow: 1; min-width: 0">
            <div style="font-size: 12.5px; font-weight: 600; line-height: 1.45; color: {{q.fg}}; text-wrap: pretty">{{q.t}}</div>
            <sc-if value="{{q.on}}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 9px; font-weight: 800; letter-spacing: .08em; color: #6A59EC; background: #EFEDFE; border-radius: 999px; padding: 3px 8px; display: inline-block; margin-top: 7px">БАСТЫ БЕТТЕ</span>
            </sc-if>
          </div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C4C4D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M16.5 3.5l4 4L8 20H4v-4z"/></svg>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 17px; background: #FFFFFF; border: 1.5px dashed #D8D4F5; cursor: pointer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6A59EC" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-size: 12.5px; font-weight: 800; color: #6A59EC">Өз сөзімді қосу</span>
    </div>

  </div>

  <div style="height: 78px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECECF3; display: flex; align-items: center; justify-content: space-around; padding: 0 18px 12px; margin-top: 12px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 10px"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 2.5v5M16 2.5v5M3.5 10.5h17"/></svg>
    <div style="width: 54px; height: 54px; border-radius: 999px; background: #7A6CF0; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 8px 20px rgba(122,108,240,.32)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M12 2.6l8.4 9.4L12 21.4 3.6 12z"/></svg>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 10px"><path d="M4 3.5h16v17l-8-4-8 4z"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" style="margin-top: 10px"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.5-4 4.2-5.5 7.5-5.5s6 1.5 7.5 5.5"/></svg>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 0, rot: false };
  }

  renderVals() {
    const texts = [
      '«Мен армандаған адам — бүгін тұрып жасайтын адам.»',
      '«Бүгін қиналсам, ертең таңдауым болады.»',
      '«Кішкентай қадам — тоқтаудан жүз есе жақсы.»',
      '«Мен көңіл-күйге емес, жүйеге сенемін.»',
      '«Ешкім көрмесе де, мен білемін.»',
    ];

    const cur = this.state.pick;
    const quotes = texts.map((t, i) => {
      const on = cur === i;
      return {
        t,
        on,
        bd: on ? '#C6BEFB' : 'transparent',
        rbd: on ? '#7A6CF0' : '#DEDEE9',
        rbg: on ? '#7A6CF0' : '#FFFFFF',
        fg: on ? '#14141B' : '#5A5A70',
        pick: () => this.setState({ pick: i }),
      };
    });

    return {
      quotes,
      active: texts[cur],
      rot: {
        bg: this.state.rot ? '#7A6CF0' : '#E2E2EC',
        just: this.state.rot ? 'flex-end' : 'flex-start',
      },
      rotToggle: () => this.setState({ rot: !this.state.rot }),
    };
  }
}
</script>
</body>
</html>
