<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, -apple-system, sans-serif; background: #F1F1F7; color: #14141B; -webkit-font-smoothing: antialiased; }
    a { color: #7A6CF0; text-decoration: none; }
    a:hover { color: #5E4FD8; }
    .lbl { font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: #9A9AAE; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F1F1F7; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; flex-shrink: 0">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14141B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <div style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .16em">УАҚЫТ</div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#14141B" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 11px; padding: 6px 20px 0; overflow: hidden">

    <!-- range switcher -->
    <div style="display: flex; gap: 3px; background: #E7E7F0; border-radius: 14px; padding: 3px">
      <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
        <div onClick="{{r.pick}}" style="flex-grow: 1; text-align: center; padding: 9px 0; border-radius: 11px; cursor: pointer; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; background: {{r.bg}}; color: {{r.fg}}; box-shadow: {{r.sh}}">{{r.n}}</div>
      </sc-for>
    </div>

    <!-- total -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 17px 18px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 10px 28px rgba(20,20,45,.05)">
      <div style="display: flex; align-items: flex-start; justify-content: space-between">
        <div>
          <div class="lbl">{{head.scope}}</div>
          <div style="display: flex; align-items: baseline; gap: 9px; margin-top: 6px">
            <span style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -.04em; line-height: 1">{{head.total}}</span>
            <span style="font-size: 12px; font-weight: 800; color: {{head.deltaC}}">{{head.delta}}</span>
          </div>
          <div style="font-size: 11px; font-weight: 600; color: #8A8A9E; margin-top: 6px">{{head.sub}}</div>
        </div>
        <div style="background: #EDEAFE; border-radius: 14px; padding: 9px 12px; text-align: right">
          <div style="font-size: 9px; font-weight: 800; letter-spacing: .1em; color: #6A59EC">ОРТАША</div>
          <div style="font-size: 14px; font-weight: 800; margin-top: 3px">{{head.avg}}</div>
        </div>
      </div>
    </div>

    <!-- stacked chart -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 16px 16px 13px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 10px 28px rgba(20,20,45,.05)">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px">
        <div class="lbl">{{chartLabel}}</div>
        <span style="font-size: 10px; font-weight: 700; color: #B4B4C6">Бағанды басып, бөлшектеп көріңіз</span>
      </div>

      <div style="display: flex; align-items: flex-end; gap: 7px; height: 148px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div onClick="{{b.pick}}" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; cursor: pointer">
            <span style="font-size: 9px; font-weight: 800; color: {{b.tc}}">{{b.tot}}</span>
            <div style="width: 100%; border-radius: 7px; overflow: hidden; display: flex; flex-direction: column; opacity: {{b.op}}; height: {{b.h}}">
              <sc-for list="{{b.segs}}" as="s" hint-placeholder-count="5">
                <div style="width: 100%; background: {{s.c}}; height: {{s.h}}"></div>
              </sc-for>
            </div>
            <span style="font-size: 9px; font-weight: 800; color: {{b.lc}}">{{b.n}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- per goal -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 16px 16px 8px; box-shadow: 0 1px 2px rgba(20,20,45,.04), 0 10px 28px rgba(20,20,45,.05); overflow: hidden">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px">
        <div class="lbl">Мақсаттар бойынша</div>
        <span style="font-size: 10.5px; font-weight: 800; color: #7A6CF0">{{head.scopeShort}}</span>
      </div>

      <sc-for list="{{goals}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid #F4F4F9">
          <div style="width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; background: {{g.c}}"></div>
          <div style="flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="font-size: 12.5px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.n}}</span>
              <span style="font-size: 12.5px; font-weight: 800; flex-shrink: 0">{{g.t}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 9px; margin-top: 6px">
              <div style="flex-grow: 1; height: 5px; border-radius: 999px; background: #F0F0F6; overflow: hidden">
                <div style="height: 5px; border-radius: 999px; background: {{g.c}}; width: {{g.w}}"></div>
              </div>
              <span style="font-size: 10.5px; font-weight: 800; color: #8A8A9E; width: 30px; text-align: right">{{g.pct}}%</span>
              <span style="font-size: 10px; font-weight: 800; color: {{g.dc}}; width: 44px; text-align: right">{{g.d}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="height: 78px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECECF3; display: flex; align-items: center; justify-content: space-around; padding: 0 18px 12px; margin-top: 11px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 10px"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 2.5v5M16 2.5v5M3.5 10.5h17"/></svg>
    <div style="width: 54px; height: 54px; border-radius: 999px; background: #7A6CF0; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 8px 20px rgba(122,108,240,.32)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M12 2.6l8.4 9.4L12 21.4 3.6 12z"/></svg>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A6CF0" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B4C6" stroke-width="2" stroke-linecap="round" style="margin-top: 10px"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.5-4 4.2-5.5 7.5-5.5s6 1.5 7.5 5.5"/></svg>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: 1, bar: -1 };
  }

  renderVals() {
    const GOALS = [
      { n: 'Ағылшын C1', c: '#7A6CF0' },
      { n: 'Жеке жоба', c: '#8B7DF3' },
      { n: 'Дене · 78 кг', c: '#9A8DF5' },
      { n: '12 кітап', c: '#AA9EF7' },
      { n: 'Басқа', c: '#C6BEFB' },
    ];

    const DATA = [
      {
        n: 'Күн',
        scope: 'Бүгін фокуста',
        scopeShort: '25 тамыз',
        chart: 'Сағат бойынша',
        labels: ['06', '09', '12', '15', '18', '21'],
        avgLabel: 'сағатына',
        delta: '+35 мин',
        up: true,
        sub: 'Кеше 4 сағ 05 мин болатын',
        rows: [
          [45, 0, 30, 0, 0],
          [0, 45, 0, 0, 10],
          [0, 30, 0, 0, 0],
          [30, 0, 0, 0, 5],
          [0, 0, 25, 20, 0],
          [0, 0, 0, 40, 0],
        ],
        deltas: ['+15', '+20', '0', '+5', '−5'],
      },
      {
        n: '7 күн',
        scope: 'Соңғы 7 күн',
        scopeShort: '19–25 тамыз',
        chart: 'Күн бойынша',
        labels: ['Ср', 'Бс', 'Жм', 'Сн', 'Жк', 'Дс', 'Сс'],
        avgLabel: 'күніне',
        delta: '+2 сағ 40 мин',
        up: true,
        sub: 'Ең өнімді күн — сенбі, 4 сағ 05 мин',
        rows: [
          [30, 45, 40, 20, 10],
          [60, 75, 0, 30, 15],
          [45, 60, 40, 20, 0],
          [90, 30, 60, 45, 20],
          [30, 0, 45, 60, 10],
          [45, 60, 40, 20, 10],
          [75, 75, 55, 60, 15],
        ],
        deltas: ['+42', '−25', '+60', '+10', '−5'],
      },
      {
        n: 'Ай',
        scope: 'Тамыз айында',
        scopeShort: '1–25 тамыз',
        chart: 'Апта бойынша',
        labels: ['31-ап', '32-ап', '33-ап', '34-ап'],
        avgLabel: 'аптасына',
        delta: '−1 сағ 20 мин',
        up: false,
        sub: 'Шілдеде 94 сағ 10 мин болатын',
        rows: [
          [420, 380, 300, 240, 90],
          [390, 420, 280, 270, 80],
          [360, 340, 310, 230, 100],
          [375, 345, 280, 255, 80],
        ],
        deltas: ['+2 сағ', '−1 сағ', '+40', '−15', '+5'],
      },
    ];

    const fmt = (m) => {
      const h = Math.floor(m / 60);
      const mm = m % 60;
      if (h === 0) return mm + ' мин';
      if (mm === 0) return h + ' сағ';
      return h + ' сағ ' + mm + ' мин';
    };

    const R = DATA[this.state.range];
    const rows = R.rows;
    const rowTotals = rows.map((r) => r.reduce((a, b) => a + b, 0));
    const max = Math.max.apply(null, rowTotals) || 1;
    const sel = this.state.bar;

    const bars = rows.map((r, i) => {
      const tot = rowTotals[i];
      const on = sel === -1 || sel === i;
      return {
        n: R.labels[i],
        tot: tot === 0 ? '—' : (tot >= 60 ? (Math.round((tot / 60) * 10) / 10) + 'с' : tot + 'м'),
        h: Math.max(Math.round((tot / max) * 118), 3) + 'px',
        op: on ? '1' : '.32',
        lc: sel === i ? '#6A59EC' : '#B4B4C6',
        tc: sel === i ? '#6A59EC' : '#C4C4D4',
        segs: r.map((v, k) => ({
          c: GOALS[k].c,
          h: tot ? Math.round((v / tot) * 100) + '%' : '0%',
        })).slice().reverse(),
        pick: () => this.setState({ bar: sel === i ? -1 : i }),
      };
    });

    const active = sel === -1 ? rows : [rows[sel]];
    const perGoal = GOALS.map((g, k) => active.reduce((a, r) => a + r[k], 0));
    const total = perGoal.reduce((a, b) => a + b, 0) || 1;

    const goals = GOALS.map((g, k) => {
      const d = R.deltas[k];
      const neg = d.indexOf('−') === 0;
      return {
        n: g.n,
        c: g.c,
        t: fmt(perGoal[k]),
        pct: Math.round((perGoal[k] / total) * 100),
        w: Math.round((perGoal[k] / total) * 100) + '%',
        d: sel === -1 ? (neg ? d : '+' + d.replace('+', '')) : '',
        dc: neg ? '#A6A6B8' : '#6A59EC',
      };
    });

    const rangeItems = DATA.map((d, i) => ({
      n: d.n,
      bg: this.state.range === i ? '#FFFFFF' : 'transparent',
      fg: this.state.range === i ? '#14141B' : '#7C7C92',
      sh: this.state.range === i ? '0 1px 3px rgba(20,20,45,.10)' : 'none',
      pick: () => this.setState({ range: i, bar: -1 }),
    }));

    const grand = rowTotals.reduce((a, b) => a + b, 0);
    const nonZero = rowTotals.filter((v) => v > 0).length || 1;

    return {
      ranges: rangeItems,
      bars,
      goals,
      chartLabel: R.chart,
      head: {
        scope: sel === -1 ? R.scope : R.labels[sel] + ' — фокуста',
        scopeShort: sel === -1 ? R.scopeShort : R.labels[sel],
        total: fmt(sel === -1 ? grand : rowTotals[sel]),
        delta: sel === -1 ? R.delta : '',
        deltaC: R.up ? '#6A59EC' : '#A6A6B8',
        sub: sel === -1 ? R.sub : 'Бағанды қайта бассаңыз — жалпы есеп',
        avg: fmt(Math.round(grand / nonZero)) + ' / ' + R.avgLabel,
      },
    };
  }
}
</script>
</body>
</html>
